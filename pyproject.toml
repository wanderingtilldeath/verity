[project]
name = "verity"
version = "0.1.0"
description = "Full-text + plagiarism search on Elasticsearch, with measured relevance and latency"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "elasticsearch[async]>=8.15,<9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "prometheus-client>=0.20",
  "mwparserfromhell>=0.6",
  "pyarrow>=16",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "nltk>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# the formatter owns line length; long prose strings and fixture text are fine
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["es: needs a running Elasticsearch (ES_URL)"]
testpaths = ["tests"]
