name: ci
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync
      # no Elasticsearch here: tests marked `es` are deselected
      - run: uv run pytest -m "not es"

  integration:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      ES_URL: http://localhost:9200
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run pytest -m es
      # tiny end-to-end smoke of the plagiarism pipeline on the fixture corpus is covered by
      # tests/test_plagiarism_e2e.py; full evals and benchmarks are far too heavy for CI.
